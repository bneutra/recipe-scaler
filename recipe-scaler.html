<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingredient Scaler</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 20px auto;
            padding: 0 20px;
        }
        textarea {
            width: 100%;
            height: 260px;
            margin-bottom: 10px;
            padding: 10px;
            font-family: monospace;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
            font-weight: bold;
        }
        .scale-control {
            margin: 20px 0;
            padding: 15px;
            background-color: #f8f9fa;
            border-radius: 4px;
        }
        .scale-control label {
            font-weight: bold;
            margin-right: 10px;
        }
        .scale-control input {
            padding: 8px;
            width: 100px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .scale-control button {
            margin-left: 10px;
        }
        .instructions {
            white-space: pre-wrap;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <h1>Ingredient Scaler</h1>
    
    <p>Paste your recipe below, e.g. copied straight from a recipe site: ingredients first (one per line), then a blank line, then any instructions.</p>
    <textarea id="ingredientInput" placeholder="Example (put ingredient list first, instructions second):
3 large eggs
½ cup all-purpose flour
½ cup milk
1 tbsp maple syrup, plus more for serving
¼ tsp salt
3 tablespoons butter

Preheat oven to 425°F.
Heat a 10” cast iron pan, melt butter in it.
Pour in batter, bake 15 min."></textarea>
    
    <button onclick="parseIngredients()">Parse Ingredients</button>
    <button onclick="generateShareLink()" style="margin-left: 10px; background-color: #28a745;">Share Link</button>
    
    <div id="scaleControl" class="scale-control" style="display: none;">
        <label for="percentage">Scale to percentage:</label>
        <input type="number" id="percentage" value="100" min="1" step="any">
        <span>%</span>
        <button onclick="scaleIngredients()">Apply</button>
    </div>
    
    <div id="tableContainer"></div>

    <div id="instructionsContainer" style="display: none;">
        <h2>Instructions</h2>
        <div id="instructions" class="instructions"></div>
    </div>

    <script src="recipe-scaler.js"></script>
    <script>
        let ingredients = [];
        
        // Simple compression using base64
        function compressText(text) {
            // Convert to base64
            return btoa(unescape(encodeURIComponent(text)));
        }
        
        function decompressText(compressed) {
            // Decode from base64
            return decodeURIComponent(escape(atob(compressed)));
        }
        
        // Load from URL parameter on page load
        window.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const ingredientsParam = urlParams.get('r');
            
            if (ingredientsParam) {
                try {
                    const decoded = decompressText(ingredientsParam);
                    document.getElementById('ingredientInput').value = decoded;
                    parseIngredients();
                } catch (e) {
                    console.error('Error loading ingredients from URL:', e);
                }
            }
        });
        
        function parseIngredients() {
            const input = document.getElementById('ingredientInput').value;
            const recipe = RecipeScaler.parseRecipe(input);
            ingredients = recipe.ingredients;
            document.getElementById('percentage').value = 100;

            // textContent (not innerHTML) so pasted text can't inject markup
            document.getElementById('instructions').textContent = recipe.instructions.join('\n');
            document.getElementById('instructionsContainer').style.display =
                recipe.instructions.length ? 'block' : 'none';
            displayTable(1);

            const hasQuantities = ingredients.some(item => item.quantity);
            document.getElementById('scaleControl').style.display = hasQuantities ? 'block' : 'none';
        }

        function generateShareLink() {
            const input = document.getElementById('ingredientInput').value.trim();
            
            if (!input) {
                alert('Please enter some ingredients first!');
                return;
            }
            
            const compressed = compressText(input);
            const baseUrl = window.location.origin + window.location.pathname;
            const shareUrl = baseUrl + '?r=' + compressed;
            
            // Check URL length
            if (shareUrl.length > 2000) {
                alert('Warning: This URL is ' + shareUrl.length + ' characters long.\n\n' +
                      'URLs over 2000 characters may not work in all browsers or when sharing.\n' +
                      'Consider shortening your ingredient content.\n\n' +
                      'The link will still be copied to your clipboard.\n\n' + shareUrl);
            }
            
            // Copy to clipboard
            navigator.clipboard.writeText(shareUrl).then(() => {
                if (shareUrl.length <= 2000) {
                    alert('Share link copied to clipboard!\n\n' + shareUrl);
                }
            }).catch(() => {
                // Fallback if clipboard API fails
                prompt('Copy this link:', shareUrl);
            });
        }
        
        function escapeHtml(text) {
            return text.replace(/[&<>"']/g, ch => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[ch]);
        }

        function displayTable(multiplier) {
            if (ingredients.length === 0) {
                document.getElementById('tableContainer').innerHTML = '<p>No ingredients found.</p>';
                return;
            }

            let html = '<table><thead><tr><th>Quantity</th><th>Unit</th><th>Ingredient</th></tr></thead><tbody>';

            ingredients.forEach(item => {
                const row = RecipeScaler.scaleLine(item, multiplier);
                html += `<tr>
                    <td>${escapeHtml(row.quantity)}</td>
                    <td>${escapeHtml(row.unitText)}</td>
                    <td>${escapeHtml(row.ingredient)}</td>
                </tr>`;
            });

            html += '</tbody></table>';
            document.getElementById('tableContainer').innerHTML = html;
        }

        function scaleIngredients() {
            const percentage = parseFloat(document.getElementById('percentage').value);

            if (isNaN(percentage) || percentage <= 0) {
                alert('Please enter a valid percentage');
                return;
            }

            displayTable(percentage / 100);
        }
    </script>
</body>
</html>
